name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 単体の検査（ブラウザは要らない）。E2E の 4 組と並列に流れる
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # PR では向け先の側（マージの試しのコミットの 1 つ目の親 HEAD^1）の教材と基準線も読む（下の品質の規則の --base）
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存インストール
        run: npm install

      - name: 単語データ検証
        run: node scripts/validate-words.mjs

      - name: 判定器（js/judge.js。gym／gymnasium・a／an・favourite／favorite・ローマ字の語末の ん・別解・答え表示の後・英字の大小文字・品詞をまたぐ別解）
        run: node scripts/test-judge.mjs

      - name: 教材の品質の規則（scripts/quality/check.mjs。誤りの規則で基準線 baseline.json に無い当たり・増えた数・古い基準線、PR では向け先の教材と比べて変わったカードの新しい当たり・向け先の基準線より上げた基準線があれば落ちる）と比べ方の検査（test-check.mjs）
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mkdir -p "$RUNNER_TEMP/base"
            git archive HEAD^1 data scripts/quality/baseline.json | tar -x -C "$RUNNER_TEMP/base"
            node scripts/quality/check.mjs --base="$RUNNER_TEMP/base"
          else
            node scripts/quality/check.mjs
          fi
          node scripts/quality/test-check.mjs

      - name: ローマ字の判定（日本語の答えの読み。js/romaji.js）
        run: node scripts/test-romaji.mjs

      - name: 記憶の保持率の集計と記録（js/retentionCalc.js・retentionLog.js・studyTime.js）
        run: node scripts/test-retention.mjs

      - name: 単語ごとの習熟度（段の規則・速さの基準・期日前に出さない・書き手。js/mastery.js・masteryMeta.js・stats.js）
        run: node scripts/test-mastery.mjs

      - name: "記録の質と影の計算（js/memoryModel.js・memoryCheck.js・stats.js の新しい欄）と不変の模擬（scripts/sim-writers.mjs: 1 年回して期日・段・習得・保持率が前の main と同じ）"
        run: node scripts/test-memory.mjs

      - name: わたしの本棚の規則（移行・照合・段の割り付け。js/shelfStore.js）
        run: node scripts/test-shelf.mjs

      - name: 学習のランク（21 段の境と名前・レベルからの割り付け・紋章の絵が揃う。js/level.js learningRankOf・js/emblem.js・scripts/build-emblems.mjs の上限）
        run: node scripts/test-level.mjs

      - name: 思い出す速さ（語ごとのすぐ・ふつう・時間がかかると、出す語の決まり。js/recallSpeed.js）
        run: node scripts/test-recall.mjs

      - name: アカウントの紋章（ランクが決まる条件・紋章を替える時機・読めない絵の扱い。js/accountEmblem.js）
        run: node scripts/test-account-emblem.mjs

      - name: 一冊を終えるまでの目安（その回の本だけ数える・初めて済みになった語だけ・記録を始めてからの暦日数で割る・365 日の上限。js/bookPace.js）
        run: node scripts/test-pace.mjs

      - name: 3 状態・スキーマ 7 の移行・最高到達ランクの決まり（js/learnState.js・js/rank.js・js/storage.js・js/sync.js・js/backup.js）
        run: node scripts/test-learn-state.mjs

      - name: 人ごとの保存の領域（見張りの読み替えと書くたびの確かめ・localStorage の使い方の形・全ページの頭・移行・切り替えの直し・展開の途中で満杯・変異。js/areaGuard.js・areaSwitch.js・areaStore.js）
        run: node scripts/test-areas.mjs

      - name: 中心の学習の出題の列（これから・あやふや・覚えた。js/learnQueue.js）
        run: node scripts/test-learn-queue.mjs

      - name: 学習状況の数・ランクの見せ方・覚えたで数える目安（js/learnPace.js・js/rank.js）
        run: node scripts/test-learn-status.mjs

      - name: モジュールの先読み（modulepreload）が最新か
        run: node scripts/modulepreload.mjs --check

      - name: タイピング練習の教材（data/typing.json）が最新か
        run: node scripts/build-typing.mjs --check

      - name: タイピングゲームの教材（data/typing-game.json）が最新か
        run: node scripts/build-typing-game.mjs --check

      - name: タイピング練習の長文の教材（data/typing-long.json）が最新か
        run: node scripts/build-typing-long.mjs --check

      - name: 公開する英単語の表（data/public/english.json）が最新か（語数・機能語は最後・NGSL の順位）
        run: node scripts/build-public-vocab.mjs --check

      - name: 公開する英単語の表の決まり（教材とファイルの写しを壊すと落ちる。scripts/build-public-vocab.mjs）
        run: node scripts/test-public-vocab.mjs

      - name: 分野パックのページと sitemap.xml が生成器（scripts/build-pack-pages.mjs）どおりか
        run: node scripts/build-pack-pages.mjs --check

      - name: 検索と導線の決まり（sitemap は主導線と規約だけ・noindex・パックのページの案内・vercel.json の旧 URL の一時的な転送・ナビ 4 つとフッター。scripts/test-site-map.mjs）
        run: node scripts/test-site-map.mjs

      - name: E2E の組分け（どの節もちょうど 1 つの組に入り、どの組の台本も構文が通る）
        run: node scripts/e2e-shard.mjs --check 4

  # E2E（tests/e2e.mjs）を 4 組に分けて並列に流す（scripts/e2e-shard.mjs。節の重さ＝CI で測った秒で釣り合わせ、毎回同じ分け方）。
  # 1 本だと CI で約 29 分かかり、上限 45 分で時間を稼いでいた（2026-10-11。1,571 件）。組はどれも頭（偽のサーバー・ブラウザ）から立ち上げ、単独で動く
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 組は表で約 865 秒。ブラウザを入れる段が 9 分かかって 20 分で止まったことがある（2026-10-27 の 2 組）ので、ゆとりを見る
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存インストール
        run: npm install

      - name: Chromiumインストール
        run: npx playwright-core install --with-deps chromium

      - name: E2Eスモークテスト（組 ${{ matrix.shard }}/4）
        run: node scripts/e2e-shard.mjs --shard ${{ matrix.shard }}/4
