<!DOCTYPE html>
<!--
  ページごとの og-image の型（1200×630）。scripts/build-og-image.mjs --page <名前> がこのファイルを ?page=<名前> で撮って
  assets/images/og-<名前>.png に書く（手で撮らない）。全ページ共通の絵の型は scripts/og-image.html。
  背景の絵は scripts/og-art/<名前>.webp（1200×800。文字の無い絵。上下を切って 1200×630 で使う）。その上に名前・金の菱・題・2 行の説明を載せる。
  名前の印・名前・金の平縁と菱は scripts/og-shared.css（全ページ共通の型と共通）。題と説明は 1 つの列に流す（.og__text）。
  色は css/tokens.css の変数、字は css/fonts.css の自前のフォント（Cormorant Garamond 600・Shippori Mincho 500）だけ。数・絵文字・ほかの名前は書かない。
  scripts/ は配信しない（.vercelignore）。
  絵を変えたら版を上げる（そのページ・E2E）: SNS は絵を URL で覚えるので、そのページの og:image の ?v=N と tests/e2e.mjs の頭の OG_PAGES で 1 つ上げる
  （E2E はどの節も OG_PAGES を読む。共通の絵の版 og-image.png?v=N は上げない）。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ページごとの og-image の型</title>
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="og-shared.css" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--vault);
    }

    .og {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: var(--vault);
      background-repeat: no-repeat;
      background-size: 1200px 800px;
    }

    /* 名前の印・名前・金の平縁と菱は scripts/og-shared.css（全ページ共通の型と同じ部品）。ここでは位置と大きさだけ */
    :root {
      --og-brand-top: 110px;
      --og-brand-gap: 18px;
      --og-mark-size: 46px;
      --og-mark-font: 21px;
      --og-name-size: 60px;
      --og-rule-top: 196px;
      --og-rule-width: 460px;
    }

    /* 題と 2 行の説明は 1 つの列に流して置く（題が長くても説明と重ならない）。どの行も折り返さない。
       列の右端が絵にかからないこと（720px 以下）と題が 1 行であることは、生成器と E2E が確かめる */
    .og__text {
      position: absolute;
      left: 96px;
      top: 232px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16.4px;
    }

    .og__title {
      margin: 0;
      white-space: nowrap;
      color: var(--on-vault);
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 72px;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
    }

    .og__sub {
      margin: 0 0 0 2px;
      white-space: nowrap;
      color: var(--on-vault);
      opacity: 0.85;
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 32px;
      line-height: 1.5;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <main class="og">
    <div class="og__brand"><span class="og__mark">SD</span><span class="og__name">SpellDash</span></div>
    <div class="og__rule"></div>
    <div class="og__text">
      <p class="og__title"></p>
      <p class="og__sub"></p>
    </div>
  </main>
  <script>
    // ページごとの中身。y は背景の絵（1200×800）の上を何 px 切るか（絵の主役が 630 の中に収まる所）
    const PAGES = {
      typing: { title: "タイピング練習", sub: ["英単語・ローマ字・長文", "登録なし・無料"], y: 60 },
      "typing-game": { title: "タイピングゲーム", sub: ["日本語の文を、ローマ字で", "登録なし・無料"], y: 100 }
    };
    const name = new URLSearchParams(location.search).get("page");
    const p = PAGES[name];
    const og = document.querySelector(".og");
    if (p) {
      og.style.backgroundImage = `url("og-art/${name}.webp")`;
      og.style.backgroundPosition = `0 -${p.y}px`;
      document.querySelector(".og__title").textContent = p.title;
      const sub = document.querySelector(".og__sub");
      p.sub.forEach((line, i) => {
        if (i) sub.append(document.createElement("br"));
        sub.append(line);
      });
    }
    og.dataset.page = p ? name : "";
  </script>
</body>
</html>
