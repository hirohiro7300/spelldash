<!DOCTYPE html>
<!--
  ページごとの og-image の型（1200×630）。scripts/build-og-image.mjs --page <名前> がこのファイルを ?page=<名前> で撮って
  assets/images/og-<名前>.png に書く（手で撮らない）。全ページ共通の絵の型は scripts/og-image.html。
  背景の絵は scripts/og-art/<名前>.webp（1200×800。文字の無い絵。上下を切って 1200×630 で使う）。その上に名前・金の菱・題・2 行の説明を載せる。
  色は css/tokens.css の変数、字は css/fonts.css の自前のフォント（Cormorant Garamond 600・Shippori Mincho 500）だけ。数・絵文字・ほかの名前は書かない。
  scripts/ は配信しない（.vercelignore）。
  絵を変えたら版を上げる（そのページ・E2E）: SNS は絵を URL で覚えるので、そのページの og:image の ?v=N と tests/e2e.mjs の OG_PAGES で 1 つ上げる。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ページごとの og-image の型</title>
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--vault);
    }

    .og {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: var(--vault);
      background-repeat: no-repeat;
      background-size: 1200px 800px;
    }

    .og__brand {
      position: absolute;
      left: 96px;
      top: 110px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .og__mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      box-sizing: border-box;
      border: 2px solid rgba(230, 200, 135, 0.7);
      border-radius: var(--radius-room);
      color: var(--foil);
      font-family: var(--font-latin);
      font-weight: 600;
      font-size: 21px;
      line-height: 1;
    }

    .og__name {
      color: var(--foil);
      font-family: var(--font-latin);
      font-weight: 600;
      font-size: 60px;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
    }

    /* 金の平縁と菱（全ページ共通の型と同じ形） */
    .og__rule {
      position: absolute;
      left: 96px;
      top: 196px;
      width: 460px;
      height: 1px;
      background: linear-gradient(to right, var(--gold) 0%, rgba(201, 163, 90, 0.55) 70%, rgba(201, 163, 90, 0) 100%);
    }

    .og__rule::before {
      content: "";
      position: absolute;
      left: 0;
      top: -5px;
      width: 9px;
      height: 9px;
      background: var(--foil);
      transform: rotate(45deg);
    }

    .og__title {
      position: absolute;
      left: 96px;
      top: 232px;
      margin: 0;
      color: var(--on-vault);
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 72px;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
    }

    .og__sub {
      position: absolute;
      left: 98px;
      top: 342px;
      margin: 0;
      color: var(--on-vault);
      opacity: 0.85;
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 32px;
      line-height: 1.5;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <main class="og">
    <div class="og__brand"><span class="og__mark">SD</span><span class="og__name">SpellDash</span></div>
    <div class="og__rule"></div>
    <p class="og__title"></p>
    <p class="og__sub"></p>
  </main>
  <script>
    // ページごとの中身。y は背景の絵（1200×800）の上を何 px 切るか（絵の主役が 630 の中に収まる所）
    const PAGES = {
      typing: { title: "タイピング練習", sub: ["英単語・ローマ字・長文", "登録なし・無料"], y: 60 },
      "typing-game": { title: "タイピングゲーム", sub: ["日本語の文を、ローマ字で", "登録なし・無料"], y: 100 }
    };
    const name = new URLSearchParams(location.search).get("page");
    const p = PAGES[name];
    const og = document.querySelector(".og");
    if (p) {
      og.style.backgroundImage = `url("og-art/${name}.webp")`;
      og.style.backgroundPosition = `0 -${p.y}px`;
      document.querySelector(".og__title").textContent = p.title;
      const sub = document.querySelector(".og__sub");
      p.sub.forEach((line, i) => {
        if (i) sub.append(document.createElement("br"));
        sub.append(line);
      });
    }
    og.dataset.page = p ? name : "";
  </script>
</body>
</html>
