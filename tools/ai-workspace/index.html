<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-bpgqoGLbrfCO0BPbuxd+J0P+M/vre7AI9/Wv/7TxQsU='; style-src 'unsafe-inline'; connect-src https: http://localhost:* http://127.0.0.1:*; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>AI作業場</title>
<meta name="description" content="ChatGPT・Claude・Muse を1つの会話でつなぐ作業場">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='10' cy='12' r='7' fill='%230b7a5e'/%3E%3Ccircle cx='22' cy='12' r='7' fill='%23b4532a'/%3E%3Ccircle cx='16' cy='22' r='7' fill='%231f5fe0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f4f0;--surface:#ffffff;--surface-2:#efede7;--surface-3:#e6e3db;
  --text:#1c1b19;--muted:#5f5b53;--faint:#8a857b;--border:#e2ded5;--border-strong:#cdc8bd;
  --accent:#2f56c9;--accent-ink:#ffffff;--accent-soft:#e7edfb;
  --danger:#b42318;--danger-soft:#fdecea;--ok:#17703f;--ok-soft:#e5f4ea;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,18,14,.05),0 6px 20px rgba(20,18,14,.05);
  --font:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK JP",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;--surface-3:#302f2c;
    --text:#ecebe7;--muted:#b0aba1;--faint:#858077;--border:#34332f;--border-strong:#4a4843;
    --accent:#93a9ff;--accent-ink:#0e1330;--accent-soft:#1f2747;
    --danger:#ff8a80;--danger-soft:#3a1d1b;--ok:#6fd8a2;--ok-soft:#173225;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:15px/1.75 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button[disabled]{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.spacer{flex:1}
.muted{color:var(--muted)}

/* 上の帯 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.dots{display:inline-flex;flex:none}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid var(--bg);margin-left:-5px}
.dots i:first-child{margin-left:0}
.brand .title{font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cost{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tools{display:flex;gap:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 10px;line-height:1.2;white-space:nowrap}
.btn:hover:not([disabled]){background:var(--surface-2)}
.btn.icon{padding:7px}
.btn.ghost{border-color:var(--border-strong);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not([disabled]){background:var(--accent);filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:var(--border-strong);background:var(--surface)}
.btn.small{padding:5px 9px;font-size:13px}
@media (max-width:720px){.tools .btn span{display:none}.tools .btn{padding:7px}.brand .sub{display:none}}
@media (max-width:560px){.cost-label{display:none}}

/* 会話 */
main{flex:1;width:100%;max-width:1060px;margin:0 auto;padding:20px 16px 8px}
.timeline{display:flex;flex-direction:column;gap:14px}
.msg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px 10px;box-shadow:var(--shadow);min-width:0}
.msg.user{background:var(--surface-2);box-shadow:none;margin-left:clamp(0px,10vw,120px)}
.msg.ai{border-left:4px solid var(--c)}
.msg.ai.summary{background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;min-width:0}
.user .head{font-size:13px;color:var(--muted)}
.user .head b{color:var(--text)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--ink);display:inline-grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:-.02em;flex:none;line-height:1}
.avatar.sm{width:24px;height:24px;font-size:10px}
.name{font-weight:700}
.model{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 8px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11.5px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px}
.status{margin-left:auto;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.status .err{color:var(--danger);font-weight:600}
.group{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.note{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:4px 0}
.note::before,.note::after{content:"";flex:1;height:1px;background:var(--border)}
.foot{display:flex;align-items:center;gap:2px;margin-top:6px;font-size:12px;color:var(--faint);min-height:30px}
.foot .meta{font-variant-numeric:tabular-nums}
.foot .btn{color:var(--muted);padding:5px}
.foot svg{width:16px;height:16px}
.dots-anim{display:inline-flex;gap:3px}
.dots-anim i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite ease-in-out}
.dots-anim i:nth-child(2){animation-delay:.15s}.dots-anim i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots-anim i{animation:none;opacity:.6}}
.error-box{background:var(--danger-soft);border-radius:10px;padding:10px 12px;margin-top:6px}
.error-box p{margin:0;color:var(--danger);font-weight:600}
.error-box code{display:block;margin-top:4px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all;color:var(--muted)}
.notice{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:6px 10px;margin:8px 0 0}

/* 本文（Markdown） */
.md{overflow-wrap:anywhere}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md p{margin:.5em 0}
.md h3,.md h4,.md h5,.md h6{margin:1em 0 .35em;line-height:1.45}
.md h3{font-size:1.14em}.md h4{font-size:1.05em}.md h5,.md h6{font-size:1em}
.md ul,.md ol{margin:.4em 0;padding-left:1.5em}
.md li{margin:.15em 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);border-radius:6px;padding:.1em .35em}
.md pre{position:relative;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow:auto;margin:.6em 0;font-size:13px;line-height:1.55}
.md pre code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.md pre .lang{position:absolute;top:3px;right:9px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.md blockquote{margin:.6em 0;padding:.1em 0 .1em 12px;border-left:3px solid var(--border-strong);color:var(--muted)}
.md hr{border:none;border-top:1px solid var(--border);margin:1em 0}
.md a{color:var(--accent)}
.table-wrap{overflow-x:auto;margin:.6em 0}
.md table{border-collapse:collapse;font-size:.93em}
.md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2)}

/* はじめの画面 */
.welcome{max-width:720px;margin:3vh auto 8px}
.hero{display:flex}
.hero i{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid var(--bg);margin-left:-11px}
.hero i:first-child{margin-left:0}
.welcome h1{font-size:clamp(22px,4.2vw,30px);margin:12px 0 4px;line-height:1.35}
.welcome .lead{color:var(--muted);margin:0 0 10px}
.callout{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--accent-soft);border-radius:14px;padding:12px 16px;margin:16px 0}
.callout p{margin:0;flex:1 1 260px}
.steps{padding-left:1.4em;margin:12px 0;color:var(--muted)}
.steps b{color:var(--text)}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.examples .label{flex-basis:100%;font-size:13px;color:var(--muted)}
.example{border:1px dashed var(--border-strong);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;font-size:13.5px;line-height:1.5}
.example:hover{border-style:solid}
.example small{display:block;color:var(--faint);font-size:11.5px}

/* 入力欄 */
.composer-wrap{position:sticky;bottom:0;z-index:15;padding:14px 16px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 16px)}
.composer{max-width:1060px;margin:0 auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.actions:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.pill:hover:not([disabled]){background:var(--surface-2)}
.pill-group{display:inline-flex;align-items:stretch;border:1px solid var(--border-strong);border-radius:999px;background:var(--surface);overflow:hidden}
.pill-group .pill{border:none;border-radius:0}
.pill-group select{border:none;border-left:1px solid var(--border);background:transparent;font-size:13px;padding:0 8px}
.box{background:var(--surface);border:1px solid var(--border-strong);border-radius:18px;box-shadow:var(--shadow);padding:8px 10px 10px}
.box:focus-within{border-color:var(--accent)}
.box textarea{display:block;width:100%;border:none;outline:none;background:transparent;resize:none;min-height:52px;max-height:40vh;line-height:1.6;padding:6px 4px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.who{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px 3px 7px;font-size:13px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surface))}
.chip[aria-pressed="false"]{color:var(--faint);border-style:dashed}
.chip[aria-pressed="false"] .dot{background:transparent;border:1.5px solid var(--faint)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:none;background:transparent;border-radius:8px;padding:4px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.rounds{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:4px 6px;font-size:13px}
#send{padding:8px 16px;border-radius:12px}
#send.stop{background:var(--danger);color:#fff}
.hint{font-size:12px;color:var(--faint);margin:6px 2px 0}
@media (max-width:560px){.controls .spacer{display:none}#send{margin-left:auto}}

/* ダイアログ */
dialog{border:none;padding:0;background:var(--surface);color:var(--text);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(780px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(10,10,10,.45)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--border)}
.sheet-head h2{margin:0;font-size:17px}
.sheet-body{overflow:auto;padding:4px 20px 16px;flex:1}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
@media (max-width:640px){dialog{width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}}
.sset{padding:14px 0 16px;border-bottom:1px solid var(--border)}
.sset:last-child{border-bottom:none}
.sset h3{font-size:15px;margin:0 0 6px}
.sset .lead{margin:0 0 6px;color:var(--muted);font-size:14px}
.sset ol{margin:6px 0 10px;padding-left:1.4em;font-size:14px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:3px;margin:10px 0;min-width:0}
.field>label{font-size:13px;font-weight:600}
.inp,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--border-strong);background:var(--bg);border-radius:10px;padding:7px 10px}
.field textarea{resize:vertical;line-height:1.6}
.help{font-size:12px;color:var(--muted)}
.help.warn{color:var(--danger)}
.keyrow{display:flex;gap:6px}
.keyrow .inp{flex:1}
details{margin:8px 0;border:1px solid var(--border);border-radius:12px;padding:4px 12px}
details>summary{cursor:pointer;font-size:14px;padding:6px 0;color:var(--muted)}
details[open]>summary{color:var(--text)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0 4px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:10px;padding:5px 10px;font-size:14px;cursor:pointer}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radios input{accent-color:var(--accent)}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:8px 0}
.preset{border:1px solid var(--border-strong);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;line-height:1.45}
.preset:hover{background:var(--surface-2)}
.preset b{display:block;font-size:14px}
.preset small{color:var(--muted);font-size:12px}
.mcard{border:1px solid var(--border);border-left:4px solid var(--c);border-radius:12px;padding:8px 12px 4px;margin:10px 0}
.mhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mname{font-weight:700;border:1px solid transparent;background:transparent;border-radius:8px;padding:3px 6px;width:9em;min-width:0}
.mname:hover,.mname:focus{border-color:var(--border-strong);background:var(--bg)}
input[type=color]{width:30px;height:28px;border:1px solid var(--border);border-radius:8px;padding:1px;background:var(--surface)}
.switch{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.switch input{width:17px;height:17px;accent-color:var(--c)}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:0 10px}
@media (max-width:640px){.mgrid{grid-template-columns:1fr}}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.trow{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;padding:6px 0;border-top:1px dashed var(--border)}
.trow .tname{font-weight:600;flex:none}
.trow .tres{flex:1;min-width:0}
.trow .tres.ok{color:var(--ok)}
.trow .tres.ng{color:var(--danger)}
.trow code{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);word-break:break-all;white-space:pre-wrap}
.hitem{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border)}
.hitem.current .htitle::before{content:"● ";color:var(--accent)}
.hopen{flex:1;min-width:0;text-align:left;border:none;background:transparent;padding:10px 4px;border-radius:8px}
.hopen:hover{background:var(--surface-2)}
.htitle{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmeta{display:block;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 0}

/* 知らせ */
.toast{position:fixed;left:50%;top:68px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:var(--danger);color:#fff}
@media (prefers-color-scheme:dark){.toast.error{color:#1a0a08}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dots" id="dots" aria-hidden="true"></span><span class="title">AI作業場</span><span class="sub" id="brandSub">ChatGPT × Claude × Muse</span></div>
  <span class="spacer"></span>
  <span class="cost" id="cost" hidden title="この会議でかかった料金（OpenRouter が知らせた分だけを合計）"></span>
  <nav class="tools" aria-label="操作">
    <button type="button" class="btn" id="btnNew" title="新しい会議"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新しい会議</span></button>
    <button type="button" class="btn" id="btnHistory" title="履歴"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg><span>履歴</span></button>
    <button type="button" class="btn" id="btnExport" title="この会議を Markdown で書き出す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg><span>書き出し</span></button>
    <button type="button" class="btn" id="btnSettings" title="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>設定</span></button>
  </nav>
</header>

<main>
  <noscript><p>この作業場は JavaScript で動きます。ブラウザの設定で JavaScript を有効にしてください。</p></noscript>
  <div class="timeline" id="timeline" aria-live="polite"></div>
</main>

<footer class="composer-wrap">
  <div class="composer">
    <div class="actions" id="actions"></div>
    <div class="box">
      <label for="input" class="sr" hidden>AIたちへのメッセージ</label>
      <textarea id="input" rows="2" placeholder="AIたちへの相談や作業の依頼を書く（Ctrl+Enter で送信）"></textarea>
      <div class="controls">
        <div class="who" id="who" role="group" aria-label="参加するAI"></div>
        <div class="seg" id="mode" role="radiogroup" aria-label="進め方"></div>
        <select class="rounds" id="rounds" aria-label="話し合う回数">
          <option value="1">1周</option><option value="2">2周</option><option value="3">3周</option>
        </select>
        <span class="spacer"></span>
        <button type="button" class="btn primary" id="send"></button>
      </div>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</footer>

<dialog id="settingsDlg" aria-labelledby="settingsTitle">
  <div class="sheet-head"><h2 id="settingsTitle">設定</h2><span class="spacer"></span><button type="button" class="btn icon" id="settingsClose" aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="sheet-body" id="settingsBody"></div>
  <div class="sheet-foot"><button type="button" class="btn ghost" id="settingsCancel">キャンセル</button><button type="button" class="btn primary" id="settingsSave">保存して閉じる</button></div>
</dialog>

<dialog id="historyDlg" aria-labelledby="historyTitle">

/* ---------- Markdown（安全な最小限の表示） ---------- */
function fmtInline(t) {

}

  if (settings.rules.trim()) L.push("", "共通のルール:", settings.rules.trim());
  L.push("", "長さ: " + LENGTH_HINTS[settings.length]);
  return L.join("\n");
}
function instructionText(member, instr) {
  switch (instr.type) {
    case "discuss":
      return `いまは「話し合い」の第${instr.round}ラウンドで、次は${member.name}（あなた）の番です。ユーザーの依頼と、ここまでのほかのメンバーの発言を踏まえて、あなたの役割から意見を述べてください。だれのどの意見に同意・反対・補足するのかをはっきりさせ、すでに出た内容の繰り返しは避けてください。`;
    case "relay": {
      const last = instr.isLast ? "あなたが最後の担当なので、完成版として仕上げてください。" : "このあと、ほかのメンバーが順に改善します。";
      return instr.prevName
        ? `いまは「リレー」形式で作業しています。直前の${instr.prevName}の成果物を引き継ぎ、あなたの役割に沿って改善した版を出してください。最初に「変えた点」を短く箇条書きにし、そのあとに成果物の全文を書いてください（成果物の長さは依頼に合わせて構いません）。${last}`
        : `いまは「リレー」形式で作業しています。あなたが最初の担当です。ユーザーの依頼に沿って、あなたの役割から成果物の第1版を作ってください（成果物の長さは依頼に合わせて構いません）。${last}`;
    }
    case "summary":
      return "ここまでの会話全体を、まとめ役として整理してください。次の見出しで、簡潔に書いてください。\n## 結論\n## 合意した点\n## 意見が分かれた点（だれがどう考えたか）\n## 次にやること";
    default:
      return `ユーザーの最新の発言に、${member.name}として答えてください。ほかのメンバーも同時に、それぞれ別々に答えています（今回のお互いの答えはまだ見えていません）。`;

}
function buildTurns(member, history, instr) {
  const turns = [];
  const push = (role, content) => {
    const last = turns[turns.length - 1];
    if (last && last.role === role) last.content += "\n\n" + content;
    else turns.push({ role, content });
  };
  for (const m of history) {
    if (m.kind === "user") push("user", `【ユーザー】\n${m.text}`);
    else if (m.kind === "ai" && m.text && (m.status === "done" || m.status === "stopped")) {
      const tail = m.status === "stopped" ? "\n（※途中で止められた発言）" : "";
      if (m.memberId === member.id) push("assistant", m.text + tail);
      else push("user", `【${m.name}】\n${m.text}${tail}`);
    }
  }
  push("user", `【進行役】\n${instructionText(member, instr)}`);
  if (turns[0].role !== "user") turns.unshift({ role: "user", content: "【進行役】\n会話を始めます。" });
  return turns;
}

/* ---------- 通信（ストリーミング） ---------- */
class UserError extends Error { constructor(msg, detail) { super(msg); this.name = "UserError"; this.detail = detail || ""; } }
const joinUrl = (base, path) => base.replace(/\/+$/, "") + "/" + path;

async function readSSE(res, onData) {
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", data = [];
  const dispatch = () => { if (data.length) { const d = data.join("\n"); data = []; onData(d); } };
  const line = (l) => {
    if (l.endsWith("\r")) l = l.slice(0, -1);
    if (l === "") { dispatch(); return; }
    if (l[0] === ":") return; // コメント行（OpenRouter の「処理中」など）
    const c = l.indexOf(":");
    const field = c < 0 ? l : l.slice(0, c);
    let val = c < 0 ? "" : l.slice(c + 1);
    if (val[0] === " ") val = val.slice(1);
    if (field === "data") data.push(val);
  };
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) { line(buf.slice(0, nl)); buf = buf.slice(nl + 1); }
    }
    buf += dec.decode();
    if (buf) line(buf);
    dispatch();
  } catch (e) {
    try { reader.cancel(); } catch { /* 無視 */ }
    throw e;
  }
}

async function httpError(res, member) {
  let raw = "";
  try { raw = await res.text(); } catch { /* 無視 */ }
  let apiMsg = "";
  try { const j = JSON.parse(raw); const e = j.error ?? j; apiMsg = typeof e === "string" ? e : (e.message || j.message || ""); }
  catch { apiMsg = raw.replace(/\s+/g, " ").slice(0, 240); }
  const p = PROVIDERS[member.provider] || PROVIDERS.openrouter;
  const st = res.status;
  const msg =
    st === 401 ? `${p.label} のAPIキーが正しくないようです。「設定」でキーを確かめてください。` :
    st === 402 ? `${p.label} の残高（クレジット）が足りません。管理画面でクレジットを追加してください。` :
    st === 403 ? `このキーでは「${member.model}」を使えないようです（地域や権限の制限、安全チェックの可能性があります）。` :
    st === 404 ? `モデル「${member.model}」が見つかりません。「設定」でモデル名を確かめてください。` :
    st === 408 || st === 504 ? "時間切れになりました。もう一度試してください。" :
    st === 413 ? "会話が長すぎて送れません。「新しい会議」を始めてください。" :
    st === 429 ? "混み合っているか、利用の上限に達しました。少し待ってからやり直してください。" :
    st >= 500 ? `${p.label} 側のサーバーで問題が起きています。少し待ってからやり直してください。` :
    st === 400 ? "リクエストが受け付けられませんでした。モデル名や設定を確かめてください。" :
    "エラーが起きました。";
  return new UserError(msg, `HTTP ${st}${apiMsg ? " — " + apiMsg : ""}`);
}
function streamError(e) {
  const m = (e && (e.message || e.type)) || "不明なエラー";
  const code = e && (e.code || e.type) ? ` (${e.code || e.type})` : "";
  return new UserError("生成の途中でエラーが起きました。やり直してください。", String(m) + code);
}
function friendly(e) {
  if (e instanceof UserError) return { msg: e.message, detail: e.detail };
  if (e && e.name === "TypeError") return { msg: "通信できませんでした。インターネット接続、広告ブロックなどの拡張機能、接続先のURLを確かめてください。", detail: String(e.message || e) };
  return { msg: "予期しないエラーが起きました。", detail: String((e && e.message) || e) };
}

async function callModel(member, system, turns, opt) {
  const ctx = opt.ctx || { keys, settings };
  const p = PROVIDERS[member.provider] || PROVIDERS.openrouter;
  const base = member.provider === "custom" ? ctx.settings.customBase : p.base;
  const key = ctx.keys[member.provider] || "";
  if (!base) throw new UserError("カスタム接続先のURLが未設定です。「設定」で入れてください。");
  if (!key && member.provider !== "custom") throw new UserError(`${p.label} のAPIキーが未設定です。「設定」から入れてください。`);
  const effort = opt.effort || ctx.settings.effort;
  return p.protocol === "anthropic"
    ? callAnthropic(base, key, member, system, turns, effort, opt)
    : callOpenAICompat(base, key, member, system, turns, effort, opt);
}

async function callOpenAICompat(base, key, member, system, turns, effort, { signal, onText }) {
  const prov = member.provider;
  const body = { model: member.model, stream: true, messages: [{ role: "system", content: system }, ...turns] };
  if (prov === "openrouter" && effort !== "auto") body.reasoning = { effort }; // 料金（usage.cost）は OpenRouter が毎回返す
  if (prov === "openai") { body.stream_options = { include_usage: true }; if (effort !== "auto") body.reasoning_effort = effort; }
  const headers = { "Content-Type": "application/json" };
  if (key) headers.Authorization = "Bearer " + key;
  if (prov === "openrouter") headers["X-Title"] = "AI Workspace";
  const res = await fetch(joinUrl(base, "chat/completions"), { method: "POST", headers, body: JSON.stringify(body), signal });
  if (!res.ok) throw await httpError(res, member);
  let text = "", usage = null, finish = "";
  const take = (j) => {
    if (j.error) throw streamError(j.error);
    const ch = Array.isArray(j.choices) ? j.choices[0] : null;
    if (ch) {
      const d = ch.delta || ch.message || {};
      if (typeof d.content === "string" && d.content) { text += d.content; onText(text); }
      if (ch.finish_reason) finish = ch.finish_reason;
    }
    if (j.usage) usage = { input: j.usage.prompt_tokens ?? null, output: j.usage.completion_tokens ?? null, cost: typeof j.usage.cost === "number" ? j.usage.cost : null };
  };
  if ((res.headers.get("content-type") || "").includes("application/json")) take(await res.json()); // ストリーミングに対応していない接続先
  else if (res.body) await readSSE(res, (data) => { if (data === "[DONE]") return; let j; try { j = JSON.parse(data); } catch { return; } take(j); });
  if (finish === "error") throw new UserError("生成の途中でエラーが起きました。やり直してください。", "finish_reason: error");
  const notice = finish === "content_filter" || finish === "refusal" ? "安全上の理由で、回答が止められました。"
    : finish === "length" ? "長さの上限に達したため、途中で終わっています。" : "";
  return { text, usage, notice };
}

async function callAnthropic(base, key, member, system, turns, effort, { signal, onText }) {
  const body = { model: member.model, max_tokens: 64000, stream: true, system, messages: turns };
  const headers = { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" };
  if (FALLBACK_MODELS.test(member.model)) { headers["anthropic-beta"] = "server-side-fallback-2026-07-01"; body.fallbacks = "default"; }
  if (effort !== "auto") body.output_config = { effort };
  const res = await fetch(joinUrl(base, "messages"), { method: "POST", headers, body: JSON.stringify(body), signal });
  if (!res.ok) throw await httpError(res, member);
  let text = "", stop = "", input = null, output = null, fellBackTo = "";
  await readSSE(res, (data) => {
    let j; try { j = JSON.parse(data); } catch { return; }
    if (j.type === "message_start") {
      const u = j.message && j.message.usage;
      if (u) input = (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0);
    } else if (j.type === "content_block_start") {
      const b = j.content_block || {};
      if (b.type === "fallback") fellBackTo = (b.to && b.to.model) || "別のモデル";
      else if (b.type === "text" && b.text) { text += b.text; onText(text); }
    } else if (j.type === "content_block_delta") {
      const d = j.delta || {};
      if (d.type === "text_delta" && d.text) { text += d.text; onText(text); }
    } else if (j.type === "message_delta") {
      if (j.delta && j.delta.stop_reason) stop = j.delta.stop_reason;
      if (j.usage && j.usage.output_tokens != null) output = j.usage.output_tokens;
    } else if (j.type === "error") throw streamError(j.error || {});
  });
  const notice = stop === "refusal" ? "安全上の理由で、この内容への回答は控えられました。"
    : stop === "max_tokens" ? "長さの上限に達したため、途中で終わっています。"
    : fellBackTo ? `安全上の判断で、途中から ${fellBackTo} が引き継いで答えました。` : "";
  return { text, usage: { input, output, cost: null }, notice };
}

function renderTimeline() {

function renderAI(m) {

function fillAI(card, m) {
  card.className = `msg ai ${m.mode || ""} st-${m.status}`;
  const st = card.querySelector(".status");
  st.replaceChildren();
  if (m.status === "pending") st.append("順番待ち");
  else if (m.status === "streaming") st.append(h("span", { class: "dots-anim", "aria-hidden": "true" }, h("i"), h("i"), h("i")), m.text ? "書いています" : "考え中");
  else if (m.status === "stopped") st.append("途中で止めました");
  else if (m.status === "error") st.append(h("span", { class: "err", text: "エラー" }));
  const body = card.querySelector(".body");
  body.innerHTML = m.text ? renderMarkdown(m.text) : "";
  if (m.status === "error" && m.error) body.append(h("div", { class: "error-box" }, h("p", { text: m.error.msg }), m.error.detail ? h("code", { text: m.error.detail }) : null));
  if (m.notice) body.append(h("p", { class: "notice", text: m.notice }));
  const foot = card.querySelector(".foot");
  foot.replaceChildren();
  if (m.status === "done" || m.status === "stopped" || m.status === "error") {
    const u = m.usage, parts = [];
    if (u && u.input != null) parts.push(`入力 ${fmtNum(u.input)}`);
    if (u && u.output != null) parts.push(`出力 ${fmtNum(u.output)} トークン`);
    if (u && typeof u.cost === "number") parts.push(`$${fmtCost(u.cost)}`);
    if (parts.length) foot.append(h("span", { class: "meta", text: parts.join(" · ") }));
    foot.append(h("span", { class: "spacer" }));
    if (m.text) foot.append(iconBtn("copy", "コピー", () => copyText(m.text)));

}
function updateCard(m) {

const dirty = new Set();
let rafId = 0;
function scheduleUpdate(m) {
  dirty.add(m);
  if (rafId) return;
  rafId = requestAnimationFrame(() => {
    rafId = 0;
    const stick = nearBottom();
    dirty.forEach(updateCard);
    dirty.clear();
    if (stick) scrollToBottom();
  });
}

function addNote(text, extra) { current.messages.push({ id: uid(), kind: "note", text, ts: Date.now(), ...extra }); }
function nextRound() {
  let n = 0;
  for (let i = current.messages.length - 1; i >= 0; i--) {
    const m = current.messages[i];
    if (m.kind === "user") break;
    if (m.kind === "note" && m.round) n = Math.max(n, m.round);
  }
  return n + 1;
}
function stripOwnHeading(text, name) { return text.replace(new RegExp(`^\\s*(【${escRe(name)}】|\\*\\*${escRe(name)}\\*\\*[:：]?)\\s*`), ""); }

async function generate(m, member, history, signal) {
  Object.assign(m, { status: "streaming", text: "", error: null, notice: "", usage: null, ts: Date.now(),
    name: member.name, color: member.color, model: member.model, provider: member.provider });
  const card = document.querySelector(`[data-mid="${m.id}"]`);
  if (card) { card.style.setProperty("--c", safeColor(m.color)); card.style.setProperty("--ink", inkFor(m.color)); fillAI(card, m); }
  try {
    const r = await callModel(member, buildSystem(member), buildTurns(member, history, m.instr || { type: "answer" }), {
      signal, onText: (t) => { m.text = stripOwnHeading(t, member.name); scheduleUpdate(m); },
    });
    m.text = stripOwnHeading(r.text || m.text, member.name);
    m.usage = r.usage; m.notice = r.notice;
    if (!m.text.trim() && !m.notice) m.notice = "（空の返事でした）";
    m.status = "done";
  } catch (e) {
    if (e && e.name === "AbortError") m.status = "stopped";
    else { m.status = "error"; m.error = friendly(e); }
  }
  updateCard(m);
  renderHeader();
  saveSoon();
}

async function withRun(fn) {
  const ctrl = new AbortController();
  running = { ctrl };
  setBusy(true);
  try { await fn(ctrl.signal); }
  finally {
    running = null;
    const stick = nearBottom(), y = window.scrollY;
    saveConvs(); renderAll();
    if (stick) scrollToBottom(); else window.scrollTo(0, y);
  }
}
const showAndFollow = () => { renderTimeline(); renderActions(); scrollToBottom(); };

async function runTurn(mode, members, rounds) {
  await withRun(async (signal) => {
    if (mode === "parallel") {
      const group = uid(), history = current.messages.slice();
      const msgs = members.map((mb) => addAI(mb, { mode: "parallel", group, instr: { type: "answer" } }));
      showAndFollow();
      await Promise.all(msgs.map((m, i) => generate(m, members[i], history, signal)));
    } else if (mode === "discuss") {
      const first = nextRound();
      for (let r = 0; r < rounds && !signal.aborted; r++) {
        addNote(`話し合い 第${first + r}ラウンド`, { round: first + r });
        for (const mb of members) {
          if (signal.aborted) break;
          const m = addAI(mb, { mode: "discuss", instr: { type: "discuss", round: first + r } });
          showAndFollow();
          await generate(m, mb, current.messages.slice(0, -1), signal);
        }
      }
    } else if (mode === "relay") {
      addNote("リレー");
      let prev = null;
      for (let i = 0; i < members.length && !signal.aborted; i++) {
        const mb = members[i];
        const m = addAI(mb, { mode: "relay", instr: { type: "relay", prevName: prev ? prev.name : "", isLast: i === members.length - 1 } });
        showAndFollow();
        await generate(m, mb, current.messages.slice(0, -1), signal);
        if (m.status === "done") prev = mb;
      }
    } else if (mode === "summary") {
      const m = addAI(members[0], { mode: "summary", instr: { type: "summary" } });
      showAndFollow();
      await generate(m, members[0], current.messages.slice(0, -1), signal);
    }
  });
}

async function send() {
  if (running) return;
  const ta = $("#input");
  const text = ta.value.trim();
  if (!text) { ta.focus(); return; }
  const members = recipientsFor(text);
  if (!members.length) { toast("答えるメンバーを1人以上オンにしてください（入力欄の下の名前を押す）。", "error"); return; }
  const miss = missingSetup(members);
  if (miss) { toast(miss, "error"); openSettings(); return; }
  ta.value = ""; autosize(ta); LS.del(KEY.draft);
  current.messages.push({ id: uid(), kind: "user", text, ts: Date.now() });
  if (!current.title) current.title = text.replace(/\s+/g, " ").slice(0, 40);
  saveConvs();
  await runTurn(settings.mode, members, settings.rounds);
}
async function continueDiscuss() {
  if (running) return;
  const members = settings.members.filter((m) => m.enabled);
  if (!members.length) { toast("参加中のメンバーがいません。", "error"); return; }
  const miss = missingSetup(members);
  if (miss) { toast(miss, "error"); openSettings(); return; }
  await runTurn("discuss", members, 1);
}
async function summarize() {
  if (running) return;
  const mb = settings.members.find((m) => m.id === summarizerId());
  if (!mb) return;
  const miss = missingSetup([mb]);
  if (miss) { toast(miss, "error"); openSettings(); return; }
  await runTurn("summary", [mb], 1);
}
async function retry(m) {
  if (running) return;
  const member = settings.members.find((x) => x.id === m.memberId)
    || { id: m.memberId, name: m.name, color: m.color, provider: m.provider || "openrouter", model: m.model, role: "" };
  const miss = missingSetup([member]);
  if (miss) { toast(miss, "error"); openSettings(); return; }
  const idx = current.messages.indexOf(m);
  const history = current.messages.slice(0, idx).filter((x) => !(m.group && x.group === m.group));
  await withRun((signal) => generate(m, member, history, signal));
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" }));
  const a = h("a", { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportMarkdown() {
  if (!current.messages.length) { toast("書き出す会話がまだありません。"); return; }
  const names = [...new Set(current.messages.filter((m) => m.kind === "ai").map((m) => m.name))];
  const L = [`# ${current.title || "AI作業場の会議"}`, "", `- 日時: ${fmtDate(current.createdAt)}`, `- 参加: ${names.join("、") || "なし"}`, ""];
  for (const m of current.messages) {
    if (m.kind === "note") L.push("---", "", `*${m.text}*`, "");
    else if (m.kind === "user") L.push("## あなた", "", m.text, "");
    else L.push(`## ${m.name}（${m.model}）${m.mode === "summary" ? " — まとめ" : ""}`, "", m.text || (m.error ? `（エラー: ${m.error.msg}）` : "（発言なし）"), "");
  }
  const d = new Date(); // ファイル名は英数字だけにする（日本語の名前は環境によって「download」に置き換わるため）
  download(`ai-workspace_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.md`, L.join("\n"), "text/markdown");
}

  }
  renderSettings();
  toast(n ? `「${p.label}」を当てはめました（「保存して閉じる」で確定）。` : "当てはめられるメンバーがいませんでした（初期の3人の接続先が対象です）。", n ? "" : "error");
}
async function runTests() {
  const out = $("#testOut"), btn = $("#testBtn");
  out.replaceChildren();
  const ctx = { keys: draft.k, settings: draft.s };
  const members = draft.s.members.filter((m) => m.enabled);
  if (!members.length) { out.append(h("p", { class: "help", text: "参加中のメンバーがいません。" })); return; }
  btn.disabled = true;
  const setRes = (row, ok, msg, detail) => {
    const r = row.querySelector(".tres");
    r.className = "tres " + (ok ? "ok" : "ng");
    r.replaceChildren(...[(ok ? "✓ " : "✗ ") + msg, detail ? h("code", { text: detail }) : null].filter(Boolean));
  };
  await Promise.all(members.map(async (m) => {
    const row = h("div", { class: "trow" }, h("span", { class: "avatar sm", vars: colorVars(m.color), text: markFor(m.name, draft.s.members), "aria-hidden": "true" }),
      h("span", { class: "tname", text: m.name }), h("span", { class: "tres", text: "確認中…" }));
    out.append(row);
    const miss = missingSetup([m], ctx.keys, ctx.settings);
    if (miss) { setRes(row, false, miss); return; }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 90000);
    try {
      const r = await callModel(m, "これは接続テストです。", [{ role: "user", content: "「OK」とだけ返してください。" }], { ctx, effort: "low", signal: ctrl.signal, onText() {} });
      setRes(row, true, `つながりました（${m.model}）。返事: ${(r.text || "").trim().slice(0, 24) || "（空）"}`);
    } catch (e) {
      const f = e && e.name === "AbortError" ? { msg: "時間切れになりました（90秒）。", detail: "" } : friendly(e);
      setRes(row, false, f.msg, f.detail);
    } finally { clearTimeout(timer); }
  }));
  btn.disabled = false;
}
function saveFromDraft() {
  const s = draft.s;
  for (const m of s.members) { m.name = String(m.name || "").trim() || "AI"; m.model = String(m.model || "").trim(); }
  const bad = s.members.find((m) => m.enabled && !m.model);
  if (bad) { toast(`${bad.name} のモデル名が空です。入れるか、「参加」を外してください。`, "error"); return; }
  if (s.customBase && !/^https?:\/\//.test(s.customBase)) { toast("カスタム接続先のURLは https:// から書いてください。", "error"); return; }
  settings = normalizeSettings(s);
  keys = { ...draft.k };
  saveSettings(); saveKeys();
  closeSettings();
  renderAll();
  toast("設定を保存しました。");
}

/* ---------- はじまり ---------- */
function init() {
  const ta = $("#input");
  $("#send").addEventListener("click", () => { if (running) running.ctrl.abort(); else send(); });
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); if (!running) send(); }
  });
  let draftTimer = 0;
  ta.addEventListener("input", () => { autosize(ta); clearTimeout(draftTimer); draftTimer = setTimeout(() => LS.set(KEY.draft, ta.value), 400); });
  $("#rounds").addEventListener("change", (e) => { settings.rounds = Number(e.target.value) || 1; saveSettings(); });
  $("#btnNew").addEventListener("click", newConversation);
  $("#btnHistory").addEventListener("click", openHistory);
  $("#btnExport").addEventListener("click", exportMarkdown);
  $("#btnSettings").addEventListener("click", openSettings);
  $("#settingsSave").addEventListener("click", saveFromDraft);
  $("#settingsCancel").addEventListener("click", closeSettings);
  $("#settingsClose").addEventListener("click", closeSettings);
  $("#settingsDlg").addEventListener("close", () => { draft = null; });
  $("#historyClose").addEventListener("click", () => $("#historyDlg").close());
  window.addEventListener("beforeunload", (e) => { if (running) { e.preventDefault(); e.returnValue = ""; } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveConvs(); });
  window.addEventListener("storage", (e) => { // ほかのタブで会議が保存・削除されたら、一覧をそろえる
    if (e.key !== KEY.convs) return;
    convs = loadConvs().filter((c) => !deletedIds.has(c.id) && c.id !== current.id);
    if (current.messages.length) convs.unshift(current);
    if ($("#historyDlg").open) renderHistory();
  });

  ta.value = LS.get(KEY.draft, "") || "";
  renderAll();
  autosize(ta);
  if (current.messages.length) scrollToBottom();
}
init();
})();
</script>
