<!DOCTYPE html>
<html lang="ja" data-area-switch>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>記録の準備 | SpellDash</title>
  <!-- 切り替えの画面（js/areaSwitch.js）: 移行・直し・切り替えをする。学習の部品は読まない。見張りは data-switch で読み、包まない（鍵の決まりだけ） -->
  <script src="/js/areaGuard.js" data-switch></script>
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/fonts.css" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/brand.css" />
  <link rel="stylesheet" href="./css/pages.css" />
  <meta name="theme-color" content="#1A2137" />
  <script>(() => { const t = localStorage.getItem("spelldash_theme"); const theme = ["dark","paper","indigo"].includes(t) ? t : "light"; document.documentElement.dataset.theme = theme; const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = { light: "#1A2137", dark: "#04060B", paper: "#20243A", indigo: "#03050C" }[theme]; })();</script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png" />
  <style>
    .area-switch { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
    .area-switch h1 { font-size: 1.15rem; line-height: 1.6; margin: 0 0 12px; }
    .area-switch p, .area-switch li { line-height: 1.8; }
    .area-switch ul { margin: 8px 0 16px; padding-left: 1.2em; }
    .area-switch__actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
  </style>
  <!-- modulepreload:start -->
  <link rel="modulepreload" href="./js/areaSwitch.js" />
  <link rel="modulepreload" href="./js/areaStore.js" />
  <!-- modulepreload:end -->
</head>
<body>
  <main class="area-switch" id="main">
    <p id="switchStatus" role="status">記録を準備している…</p>
    <section id="switchRecovery" data-reason="" hidden aria-labelledby="switchLead">
      <h1 id="switchLead">この端末に記録を安全に保存できなかったため、切り替えられません。</h1>
      <p id="switchQuota" hidden><strong>この端末の保存の空きが足りない。</strong></p>
      <p>記録はこの端末に残っている。学習・保存・同期は止めた。</p>
      <ul>
        <li>ほかの SpellDash のタブを閉じる。</li>
        <li>端末の空きを作る（使わないアプリや写真を消す）。</li>
        <li>プライベートの窓では開かない。</li>
        <li>記録を書き出してから、もう一度試す。</li>
      </ul>
      <div class="area-switch__actions">
        <button type="button" class="btn btn--ghost" id="switchExport">記録を書き出す</button>
        <button type="button" class="btn" id="switchRetry">もう一度</button>
      </div>
    </section>
  </main>
  <script type="module" src="./js/areaSwitch.js"></script>
</body>
</html>
